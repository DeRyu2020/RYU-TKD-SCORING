<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KPNP PSS - Taekwondo Scoreboard System V5.3 (Extend Display)</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
    body {
      background-color: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      position: relative;
    }
    .top-bar { display:flex; align-items:center; justify-content:space-between; width:100%; height:58px; padding:0 15px; background:#1b1b1b; box-sizing:border-box; }
    .app-title { font-size:18px; font-weight:700; color:#8c8c8c; white-space:nowrap; }
    .header-info { 
    display:flex; 
    justify-content:
    space-between; 
    width:100%; 
    font-size:22px; 
    font-weight:bold; 
    background:#111; 
    padding:18px 30px; 
    border-radius:10px; 
    border:1px solid #444; 
    position:relative;
    height:62px;
   }
    .header-info div span { color:#f39c12; }

    .scoreboard { display:grid; grid-template-columns:minmax(300px,1fr) minmax(180px,14vw) minmax(300px,1fr); gap:8px; width:100%; flex:1; margin:8px 0; min-height:0; overflow:hidden; }

    .fighter-section { display:flex; flex-direction:column; width:100%; min-width:0; border-radius:0 !important; overflow:hidden; box-shadow:0 4px 10px rgba(0,0,0,0.5); }
    .chung-section { background:#003366; border:2px solid #0033aa; }
    .hong-section { background:#660000; border:2px solid #aa0000; }

    .fighter-header-box { text-align:center; padding:10px 10px 6px 10px; overflow:hidden; }
    .fighter-name { font-size:clamp(34px,2.8vw,40px); font-weight:700; text-transform:uppercase; margin-bottom:2px; text-shadow:2px 2px 4px rgba(0,0,0,0.8); color:#fff !important; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .fighter-club { font-size:clamp(21px,1.9vw,32px); font-weight:600; color:#bbb; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .fighter-body-row { display:flex; flex-direction:row; flex:1; align-items:stretch; width:100%; min-height:0; }

    /* ============= OPTIMASI: GPU ACCELERATION & PERFORMANCE ============= */
    .side-score-history { 
      padding:6px; 
      width:85px; 
      flex-shrink:0; 
      display:flex; 
      flex-direction:column; 
      gap:4px; 
      overflow-y:auto; 
      max-height:470px; 
      height:100%; 
      align-items:center; 
      will-change: transform;
      transform: translate3d(0,0,0);
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .side-score-history::-webkit-scrollbar { display: none; }
    
    .side-history-title { font-size:8px; color:#aaa; text-align:center; text-transform:uppercase; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:4px; margin-bottom:4px; font-weight:bold; width:100%; }
    .history-header-row { display:grid; grid-template-columns:repeat(3,1fr); width:100%; text-align:center; margin-bottom:4px; border-bottom:1px dashed rgba(255,255,255,0.15); padding-bottom:4px; justify-items:center; align-items:center; }

    .judge-box-hdr {
      width:20px; height:20px; border-radius:4px; display:flex; align-items:center; justify-content:center;
      font-weight:900; font-size:10px; border:1px solid rgba(255,255,255,0.3); background:#222; color:#ccc;
    }

    /* warna billiard untuk header (letakkan setelah .judge-box-hdr agar override bekerja) */
    .judge-ball-val-1 {
      background: radial-gradient(circle at 35% 35%, #ffee00 0%, #cc9900 100%) !important;
      color: #000 !important;
      box-shadow: 0 0 6px rgba(255,238,0,0.12);
      border-color: rgba(255,255,255,0.08);
    }
    .judge-ball-val-2 {
      background: radial-gradient(circle at 30% 30%, #55ff77, #00cc33) !important;
      color: #111 !important;
      box-shadow: 0 0 8px rgba(85,255,119,0.12);
      border-color: rgba(255,255,255,0.06);
    }
    .judge-ball-val-3 {
      background: radial-gradient(circle at 35% 35%, #ff3333 0%, #880000 100%) !important;
      color: #fff !important;
      box-shadow: 0 0 10px rgba(255,51,51,0.18);
      border-color: rgba(255,255,255,0.06);
    }
    .judge-ball-val-4 {
      background: radial-gradient(circle at 35% 35%, #9933ff 0%, #330066 100%) !important;
      color: #fff !important;
      box-shadow: 0 0 8px rgba(153,51,255,0.12);
      border-color: rgba(255,255,255,0.06);
    }
    .judge-ball-val-5 {
      background: radial-gradient(circle at 35% 35%, #ff9900 0%, #884400 100%) !important;
      color: #fff !important;
      box-shadow: 0 0 8px rgba(255,153,0,0.12);
      border-color: rgba(255,255,255,0.06);
    }

   .history-grid-container { 
      display:flex; 
      flex-direction:column; 
      width:100%; 
      gap:1px; 
      overflow-y:auto; 
      max-height:380px; 
      will-change: transform;
      transform: translate3d(0,0,0);
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .history-grid-container::-webkit-scrollbar,
    .side-score-history::-webkit-scrollbar {
      display: none;
    }
    .history-row-item { 
      display:grid; 
      grid-template-columns:repeat(3,1fr); 
      width:100%; 
      gap:2px; 
      align-items:center; 
      justify-items:center; 
      background:rgba(255,255,255,0.03); 
      border-radius:4px; 
      padding:2px 0;
      transition: none;
      will-change: auto;
    }
    .history-judge-column { display:flex; flex-direction:column; align-items:center; width:100%; }
    .billiard-ball { 
      width:15px; 
      height:15px; 
      border-radius:50%; 
      display:flex; 
      align-items:center; 
      justify-content:center; 
      font-weight:bold; 
      color:#000; 
      border:1px solid rgba(255,255,255,0.2); 
      margin:0 auto;
      flex-shrink:0;
      will-change: auto;
      box-shadow: inset -1px -1px 2px rgba(0,0,0,0.5);
    }
    .ball-val-1 { background: radial-gradient(circle at 35% 35%, #ffee00 0%, #cc9900 100%); }
    .ball-val-2 { background: radial-gradient(circle at 30% 30%, #55ff77, #00cc33); color:#111; }
    .ball-val-3 { background: radial-gradient(circle at 35% 35%, #ff3333 0%, #880000 100%); color:#fff; }
    .ball-val-4 { background: radial-gradient(circle at 35% 35%, #9933ff 0%, #330066 100%); color:#fff; }
    .ball-val-5 { background: radial-gradient(circle at 35% 35%, #ff9900 0%, #884400 100%); color:#fff; }
    .ball-number { font-size:10px; font-weight: bold }

    /* remaining styles (timer, winner overlay, etc.) - unchanged from previous file */
    .fighter-card { display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:20px 15px; position:relative; min-height:470px; flex:1; width:100%; }
    .chung { background:#0066ff; box-shadow:0 0 15px rgba(0,102,255,0.8); }
    .hong { background:#ff003c; box-shadow:0 0 15px rgba(255,0,60,0.8); }
    .round-wins-container { position:absolute; top:15px; display:flex; flex-direction:column; gap:6px; }
    .chung .round-wins-container { right:15px; }
    .hong .round-wins-container { left:15px; }

/* REVERSE SCREEN - posisi Win Dot */
.scoreboard.swapped .chung .round-wins-container {
    left: 15px;
    right: auto;
}

.scoreboard.swapped .hong .round-wins-container {
    right: 15px;
    left: auto;
}
  
.win-dot { 
  width: 32px; 
  height: 32px; 
  border-radius: 50%; 
  background: transparent;       /* Menyatu dengan background card */
  border: 2px solid transparent; /* Garis pinggir disembunyikan */
  display: flex; 
  align-items: center; 
  justify-content: center; 
  font-size: 12px; 
  font-weight: bold; 
  color: transparent;            /* Teks/angka disembunyikan saat belum aktif */
  transition: all 0.3s ease;     /* Efek transisi halus saat titik menyala */
}

.mini-scores-container {
  display: none;
  flex-direction: column;
  gap: 4px;
  position: absolute;
  top: 15px;
  font-size: 24px;
  font-weight: 800;
  color: #ffffff;
  z-index: 10;
  white-space: nowrap;
}

/* Border putih & background transparan untuk setiap baris skor/span */
.mini-scores-container span,
.mini-score {
  border: none; /* Border putih semi-transparan */
  background: transparent;      /* Latar belakang tipis agar tulisan jelas */
  padding: 0;
  border-radius: 0;
  color: #ffffff;
  box-shadow: none;
  font-weight: 700;
}

/* Card Biru (Chung) - Rata Kiri */
.chung .mini-scores-container {
  left: 15px;
  right: auto;
  align-items: flex-start;
}

/* Card Merah (Hong) - Rata Kanan */
.hong .mini-scores-container {
  right: 15px;
  left: auto;
  align-items: flex-end;
}

/* =========================================================
   REVERSE SCREEN - MINI SCORE
   ========================================================= */

/* REVERSE
   HONG kiri   -> Mini Score kiri
   CHUNG kanan -> Mini Score kanan
*/
.scoreboard.swapped .chung .mini-scores-container {
    left: auto;
    right: 15px;
    align-items: flex-end;
}

.scoreboard.swapped .hong .mini-scores-container {
    right: auto;
    left: 15px;
    align-items: flex-start;
}

/* Item per baris ronde */
.mini-score-item {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Ukuran & Perataan Label R1, R2, R3 */
.round-label {
  width: 32px;
  font-weight: 800;
  color: #f1c40f; /* Warna kuning emas agar kontras */
  flex-shrink: 0;
}

.chung .round-label {
  text-align: left;
}

.hong .round-label {
  text-align: right;
}

/* Perataan Angka Skor */
.round-value {
  min-width: 45px;
  font-weight: 900;
  font-variant-numeric: tabular-nums; /* Lebar digit angka seragam */
}

.chung .round-value {
  text-align: left;
}

.hong .round-value {
  text-align: right;
}

/* Reverse: HONG sekarang berada di kiri */
.scoreboard.swapped .hong .round-label {
    text-align: left;
}

.scoreboard.swapped .hong .round-value {
    text-align: left;
}

/* Reverse: CHUNG sekarang berada di kanan */
.scoreboard.swapped .chung .round-label {
    text-align: right;
}

.scoreboard.swapped .chung .round-value {
    text-align: right;
}

.win-dot.active { 
  background: #f1c40f; 
  border-color: #fff; 
  color: #000; 
  box-shadow: 0 0 12px #f39c12; 
  transform: scale(1.1); 
}

    .score-display { font-size:clamp(300px,15vw,400px); font-weight:900; line-height:0.95; display:flex; align-items:center; justify-content:center; flex:1; width:100%; margin:15px 0; text-align:center; text-shadow: 3px 3px 6px rgba(0,0,0,0.8); color:#fff; will-change: auto; }
    .score-display.color-white { color:#fff !important; } 
    .score-display.color-yellow { color:#f1c40f !important; }

    .gamjeom-container {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 10px;

    background: rgba(0,0,0,0.4);

    padding: 8px 18px;

    border-radius: 8px;

    width: 140px !important;

    margin-top: auto;
}

   .gamjeom-label { font-size:20px; color:#aaa; } .gamjeom-score { font-size:36px; font-weight:bold; color:#f1c40f; }

    .center-panel { 
  display: flex; 
  flex-direction: column; 
  justify-content: flex-start; 
  align-items: center; 
  background: #222; 
  border-radius: 12px; 
  border: 1px solid #444; 
  padding: 45px 20px 20px 20px; /* Top: 45px (turun lebih bawah), Right/Bottom/Left: 20px */
  gap: 8px;                     /* Sedikit diperlebar dari 2px agar tidak terlalu rapat */
  position: relative; 
}

    .center-match-no { font-size:60px; font-weight:bold; font-family:'Arial Black', Gadget, sans-serif; color:#f39c12; background:rgba(0,0,0,0.3); padding:5px 12px; border-radius:6px; border:1px solid #444; text-transform: uppercase; letter-spacing: 1px; }
    .match-group { margin-bottom:40px; width:100%; text-align:center; } .match-label { font-size:30px; font-weight:bold; font-family:'Arial Black', Gadget, sans-serif; letter-spacing:2px; color:#fff; margin-bottom:4px; }
    .round-title { margin-top: 45px !important; font-size:30px; font-weight:bold; color:#fff; text-transform:uppercase; } .round-number { font-size:80px; font-weight:bold; color:#fff; margin-bottom:5px; }
    .timer-status { font-size:22px; font-weight:900; letter-spacing:3px; color:#888; margin-bottom:6px; text-transform:uppercase; text-align:center; line-height:1; will-change: auto; }
    .timer-display { font-size:95px !important; font-family:'Bebas Neue', sans-serif; font-weight:bold; color:#00ff66; background:#000; padding:2px 14px; border-radius:8px; border:2px solid #333; line-height:1; letter-spacing:1px; white-space:nowrap; box-shadow: 0 4px 10px rgba(0,0,0,0.5); will-change: auto; }
    .timer-display.rest-mode { 
  background-color: #f1c40f !important; 
  color: #000000 !important; 
  border-color: #f39c12 !important; }
    .timer-display.pause-highlight { background-color:#332b00 !important; border-color:#f1c40f !important; color:#f1c40f !important; }

    .timer-reason-box { position:absolute; left:0; width:100%; padding:6px 12px; background:#f1c40f; color:#000; border-radius:6px; font-size:24px; font-weight:bold; text-align:center; text-transform:uppercase; display:none; letter-spacing:1px; }
    @media (max-width:860px) { .timer-reason-box { font-size:18px; padding:6px 10px; } }

    .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); z-index:1000; justify-content:center; align-items:center; }
    .winner-modal-content { background:#111; border:4px solid #f39c12; border-radius:16px; width:90%; max-width:650px; padding:20px; text-align:center; box-shadow:0 0 40px rgba(243,156,18,0.4); position:relative; }
    .fullscreen-winner-overlay { display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:2000; flex-direction:column; justify-content:center; align-items:center; padding:40px; }
    .fullscreen-winner-overlay.bg-chung { background:linear-gradient(135deg,#001133 0%,#0044cc 50%,#001133 100%); border:15px solid #0066ff; }
    .fullscreen-winner-overlay.bg-hong { background:linear-gradient(135deg,#330000 0%,#cc0000 50%,#330000 100%); border:15px solid #ff3333; }
    .fs-match-no { font-size:38px; font-weight:800; color:#f1c40f; letter-spacing:3px; margin-bottom:10px; }
    .fs-winner-badge { font-size:28px; font-weight:900; color:#fff; text-transform:uppercase; letter-spacing:4px; margin-bottom:25px; background:rgba(0,0,0,0.6); padding:10px 30px; border-radius:10px; }
    .fs-winner-card { background:rgba(0,0,0,0.75); border:4px solid #fff; border-radius:20px; width:90%; max-width:900px; padding:40px 20px; text-align:center; display:flex; flex-direction:column; align-items:center; }

    body.reverse-mode { transform:rotate(180deg); transition:transform 0.3s ease; }

.ryu-logo{
    position:absolute;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    height:48px;
    width:auto;
}

/* Posisi Normal */
.chung-section { order: 1; }
.center-panel  { order: 2; }
.hong-section  { order: 3; }

/* Posisi Dibalik (Swapped) */
.scoreboard.swapped .chung-section { order: 3; }
.scoreboard.swapped .hong-section  { order: 1; }

/* Menjaga History tetap berada di posisi paling luar layar */
.scoreboard.swapped .chung-section .fighter-body-row,
.scoreboard.swapped .hong-section .fighter-body-row {
  flex-direction: row-reverse;
}

/* =========================================================
   LAYOUT BARU
   HEADER NAMA MENYATU DI TENGAH
   CENTER PANEL DIMULAI DI BAWAH HEADER
   ========================================================= */

/* Scoreboard menjadi area relatif untuk center panel */
.scoreboard {
    position: relative;
    display: grid;

    /*
       Hanya 2 kolom:
       kiri = CHUNG
       kanan = HONG

       Center panel akan diletakkan sebagai overlay
       di tengah bagian bawah.
    */
    grid-template-columns: 1fr 1fr;

    gap: 8px;
    width: 100%;
    flex: 1;
    margin: 8px 0;
    min-height: 0;
    overflow: hidden;
}


/* =========================================================
   FIGHTER SECTION
   ========================================================= */

.fighter-section {
    position: relative;
    width: 100%;
    min-width: 0;
    height: 100%;

    border-radius: 15px;
    overflow: hidden;

    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}


/* =========================================================
   HEADER NAMA + KLUB
   ========================================================= */

/*
   Header dibuat lebih tinggi sehingga background
   biru dan merah bertemu tepat di tengah.
*/

/* =========================================================
   GRID NAMA + CLUB
   ========================================================= */

.fighter-header-box {
    min-height: 80px !important;

    height: 80px !important;

    padding: 3px 10px 2px 10px !important;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    box-sizing: border-box;

    border-radius: 0 !important;
}


/* =========================================================
   NAMA
   ========================================================= */

.fighter-name {
    width: 100%;
    text-align: center;

    font-size: clamp(34px, 2.8vw, 40px);
    font-weight: 700;

    text-transform: uppercase;

    margin: 0 !important;

    line-height: 0.95 !important;

    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);

    color: #fff !important;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


/* =========================================================
   CLUB
   ========================================================= */

.fighter-club {
    width: 100%;
    text-align: center;

    font-size: clamp(21px, 1.9vw, 32px);
    font-weight: 600;

    color: #bbb;

    text-transform: uppercase;

    margin: 0 !important;

    line-height: 0.95 !important;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* =========================================================
   BODY FIGHTER
   ========================================================= */

.fighter-body-row {
    position: relative;

    display: flex;
    flex-direction: row;

    width: 100%;

    height: calc(100% - 110px) !important;

    min-height: 0;

    align-items: stretch;
}

/* =========================================================
   CENTER PANEL
   ========================================================= */

/*
   CENTER PANEL TIDAK lagi menjadi kolom grid penuh.

   Dia menjadi panel overlay yang dimulai
   setelah header nama/klub.
*/

.center-panel {
    position: absolute;
    z-index: 50;

    top: 145px;
    bottom: 0;

    /* PANEL TENGAH DIPERSEMPIT */
    left: 41%;
    width: 18%;

    margin: 0;

    background: #222;

    border-radius: 0;
    border: 1px solid #444;

    display: flex;
    flex-direction: column;

    justify-content: flex-start;
    align-items: center;

    padding: 20px;

    gap: 8px;

    overflow: hidden;
}
/* =========================================================
   MATCH
   ========================================================= */

.center-panel {
    position: absolute;
    z-index: 50;

    top: 145px;
    bottom: 0;

    /* Lebar panel mengikuti ukuran MATCH */
    left: 50%;
    width: 220px;

    transform: translateX(-50%);

    margin: 0;

    background: #222;

    border-radius: 0;
    border: 1px solid #444;

    display: flex;
    flex-direction: column;

    justify-content: flex-start;
    align-items: center;

    padding: 20px;

    gap: 8px;

    overflow: hidden;
}

/* =========================================================
   MATCH GROUP
   ========================================================= */

.match-group {
    width: 100%;

    text-align: center;

    margin-bottom: 20px;
}


/* =========================================================
   TIMER
   ========================================================= */

.timer-status {
    width: 100%;

    text-align: center;

    font-size: 22px;

    font-weight: 900;

    letter-spacing: 3px;

    color: #888;

    margin-bottom: 6px;

    text-transform: uppercase;

    line-height: 1;
}


/* =========================================================
   TIMER BOX - MENGIKUTI UKURAN FONT TIMER
   ========================================================= */

.timer-display {
    width: fit-content !important;
    min-width: fit-content !important;
    max-width: none !important;

    display: inline-flex !important;

    align-self: center !important;

    flex: 0 0 auto !important;

    margin-left: auto !important;
    margin-right: auto !important;

    box-sizing: border-box !important;

    justify-content: center !important;
    align-items: center !important;

    white-space: nowrap !important;

    transform: translateX(-20px) !important;
}

/* =========================================================
   ROUND
   ========================================================= */

.round-title {
    margin-top: 45px !important;
    width: 100%;

    text-align: center;

    font-size: 30px;

    font-weight: bold;

    color: #fff;

    text-transform: uppercase;
}


.round-number {
    width: 100%;

    text-align: center;

    font-size: 80px;

    font-weight: bold;

    color: #fff;

    margin-bottom: 5px;
}


/* =========================================================
   NORMAL ORDER
   ========================================================= */

.chung-section {
    grid-column: 1;
}

.hong-section {
    grid-column: 2;
}


/* =========================================================
   REVERSE ORDER
   ========================================================= */

/*
   Saat Reverse:
   CHUNG -> kanan
   HONG  -> kiri
*/

.scoreboard.swapped .chung-section {
    grid-column: 2;
}

.scoreboard.swapped .hong-section {
    grid-column: 1;
}


/* =========================================================
   HISTORY TETAP DI SISI LUAR
   ========================================================= */

.scoreboard.swapped .chung-section .fighter-body-row,
.scoreboard.swapped .hong-section .fighter-body-row {
    flex-direction: row-reverse;
}


/* =========================================================
   WIN DOT
   ========================================================= */

/* Normal */
.chung .round-wins-container {
    right: 15px;
    left: auto;
}

.hong .round-wins-container {

  </style>
</head>
<body>
  <div class="top-bar">
    <div class="app-title">🥋 TKD SCOREBOARD - Extend Display</div>
  </div>

  <div class="header-info">
    <div>Match: <span id="matchNo">0</span></div>
    <div>Chung: <span id="chungName">-</span></div>
    <div>Hong: <span id="hongName">-</span></div>
  </div>

  <div class="scoreboard" id="scoreboard">
    <!-- CHUNG (Biru) -->
    <div class="fighter-section chung-section">
      <div class="fighter-header-box chung-header">
        <div class="fighter-name" id="chungFighterName">CHUNG</div>
        <div class="fighter-club" id="chungClub">-</div>
      </div>
      <div class="fighter-body-row">
        <div class="side-score-history chung-history">
          <div class="side-history-title">History</div>
          <div class="history-header-row">
            <div class="judge-box-hdr">J1</div>
            <div class="judge-box-hdr">J2</div>
            <div class="judge-box-hdr">J3</div>
          </div>
          <div class="history-grid-container" id="chungHistory"></div>
        </div>
        <div class="fighter-card chung">
          <div class="round-wins-container" id="chungWins"></div>
          <div class="score-display" id="chungScore">0</div>
          <div class="gamjeom-container">
            <div class="gamjeom-label">GJ:</div>
            <div class="gamjeom-score" id="chungGamjeom">0</div>
          </div>
        </div>
      </div>
    </div>

    <!-- CENTER PANEL -->
    <div class="center-panel">
      <div class="match-group">
        <div class="match-label">MATCH</div>
        <div class="center-match-no" id="centerMatchNo">0</div>
      </div>
      <div class="round-title">ROUND</div>
      <div class="round-number" id="roundNumber">1</div>
      <div class="timer-status" id="timerStatus">READY</div>
      <div class="timer-display" id="timerDisplay">00:00</div>
    </div>

    <!-- HONG (Merah) -->
    <div class="fighter-section hong-section">
      <div class="fighter-header-box hong-header">
        <div class="fighter-name" id="hongFighterName">HONG</div>
        <div class="fighter-club" id="hongClub">-</div>
      </div>
      <div class="fighter-body-row">
        <div class="fighter-card hong">
          <div class="round-wins-container" id="hongWins"></div>
          <div class="score-display" id="hongScore">0</div>
          <div class="gamjeom-container">
            <div class="gamjeom-label">GJ:</div>
            <div class="gamjeom-score" id="hongGamjeom">0</div>
          </div>
        </div>
        <div class="side-score-history hong-history">
          <div class="side-history-title">History</div>
          <div class="history-header-row">
            <div class="judge-box-hdr">J1</div>
            <div class="judge-box-hdr">J2</div>
            <div class="judge-box-hdr">J3</div>
          </div>
          <div class="history-grid-container" id="hongHistory"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // PERFORMA OPTIMIZATION - BATCHING & CACHING
    // ============================================================
    const PerfOptimizer = {
      // Cache untuk mencegah redundant updates
      cache: {
        chungScore: null,
        hongScore: null,
        chungGamjeom: null,
        hongGamjeom: null,
        timerText: null,
        timerStatus: null,
      },

      // RAF batch queue
      updateQueue: [],
      rafId: null,
      historyLimit: 12, // Limit history items

      // Queue update dengan RAF
      queue(callback) {
        this.updateQueue.push(callback);
        if (!this.rafId) {
          this.rafId = requestAnimationFrame(() => this.processBatch());
        }
      },

      // Proses semua update dalam 1 frame
      processBatch() {
        this.updateQueue.forEach(cb => cb());
        this.updateQueue = [];
        this.rafId = null;
      },

      // Skip update jika value sama
      isDifferent(key, value) {
        if (this.cache[key] !== value) {
          this.cache[key] = value;
          return true;
        }
        return false;
      },

      // Limit history items
      limitHistory(container) {
        const items = container.querySelectorAll('.history-row-item');
        while (items.length > this.historyLimit) {
          items[0].remove();
        }
      }
    };

    // ============================================================
    // API untuk extend display - sama dengan fungsi asli
    // ============================================================
    window.updateExtendScore = function(chung, hong) {
      if (!PerfOptimizer.isDifferent('chungScore', chung)) return;
      if (!PerfOptimizer.isDifferent('hongScore', hong)) return;
      
      PerfOptimizer.queue(() => {
        document.getElementById('chungScore').textContent = chung;
        document.getElementById('hongScore').textContent = hong;
      });
    };

    window.updateExtendGamjeom = function(chung, hong) {
      if (!PerfOptimizer.isDifferent('chungGamjeom', chung)) return;
      if (!PerfOptimizer.isDifferent('hongGamjeom', hong)) return;

      PerfOptimizer.queue(() => {
        document.getElementById('chungGamjeom').textContent = chung;
        document.getElementById('hongGamjeom').textContent = hong;
      });
    };

    window.updateExtendTimer = function(timeStr, status) {
      if (!PerfOptimizer.isDifferent('timerText', timeStr)) return;
      if (!PerfOptimizer.isDifferent('timerStatus', status)) return;

      PerfOptimizer.queue(() => {
        const display = document.getElementById('timerDisplay');
        display.textContent = timeStr;
        display.className = 'timer-display';
        if (status === 'rest') display.classList.add('rest-mode');
      });
    };

    window.updateExtendRound = function(roundNum) {
      PerfOptimizer.queue(() => {
        document.getElementById('roundNumber').textContent = roundNum;
      });
    };

    window.updateExtendMatch = function(matchNo) {
      PerfOptimizer.queue(() => {
        document.getElementById('centerMatchNo').textContent = matchNo;
        document.getElementById('matchNo').textContent = matchNo;
      });
    };

    window.addExtendHistory = function(judgesChung, judgesHong) {
      PerfOptimizer.queue(() => {
        // CHUNG HISTORY
        const chungContainer = document.getElementById('chungHistory');
        const chungRow = document.createElement('div');
        chungRow.className = 'history-row-item';
        judgesChung.forEach(score => {
          const col = document.createElement('div');
          col.className = 'history-judge-column';
          const ball = document.createElement('div');
          ball.className = `billiard-ball ball-val-${score}`;
          ball.innerHTML = `<div class="ball-number">${score}</div>`;
          col.appendChild(ball);
          chungRow.appendChild(col);
        });
        chungContainer.appendChild(chungRow);
        chungContainer.scrollTop = chungContainer.scrollHeight;
        PerfOptimizer.limitHistory(chungContainer);

        // HONG HISTORY
        const hongContainer = document.getElementById('hongHistory');
        const hongRow = document.createElement('div');
        hongRow.className = 'history-row-item';
        judgesHong.forEach(score => {
          const col = document.createElement('div');
          col.className = 'history-judge-column';
          const ball = document.createElement('div');
          ball.className = `billiard-ball ball-val-${score}`;
          ball.innerHTML = `<div class="ball-number">${score}</div>`;
          col.appendChild(ball);
          hongRow.appendChild(col);
        });
        hongContainer.appendChild(hongRow);
        hongContainer.scrollTop = hongContainer.scrollHeight;
        PerfOptimizer.limitHistory(hongContainer);
      });
    };

    window.updateExtendWinDots = function(chungWins, hongWins) {
      PerfOptimizer.queue(() => {
        // CHUNG WINS
        const chungContainer = document.getElementById('chungWins');
        chungContainer.innerHTML = '';
        for (let i = 0; i < 3; i++) {
          const dot = document.createElement('div');
          dot.className = 'win-dot';
          if (i < chungWins) dot.classList.add('active');
          dot.textContent = i + 1;
          chungContainer.appendChild(dot);
        }

        // HONG WINS
        const hongContainer = document.getElementById('hongWins');
        hongContainer.innerHTML = '';
        for (let i = 0; i < 3; i++) {
          const dot = document.createElement('div');
          dot.className = 'win-dot';
          if (i < hongWins) dot.classList.add('active');
          dot.textContent = i + 1;
          hongContainer.appendChild(dot);
        }
      });
    };

    window.updateExtendFighterInfo = function(chungName, chungClub, hongName, hongClub) {
      PerfOptimizer.queue(() => {
        document.getElementById('chungFighterName').textContent = chungName.toUpperCase();
        document.getElementById('chungClub').textContent = chungClub.toUpperCase();
        document.getElementById('hongFighterName').textContent = hongName.toUpperCase();
        document.getElementById('hongClub').textContent = hongClub.toUpperCase();
        document.getElementById('chungName').textContent = chungName.toUpperCase();
        document.getElementById('hongName').textContent = hongName.toUpperCase();
      });
    };

    // Optional: swap display
    window.swapExtendDisplay = function(isSwapped) {
      const scoreboard = document.getElementById('scoreboard');
      if (isSwapped) {
        scoreboard.classList.add('swapped');
      } else {
        scoreboard.classList.remove('swapped');
      }
    };

    console.log('✓ Extend Display Loaded - Performance Optimized');
  </script>
</body>
</html>

    .header-info { 
    display:flex; 
    justify-content:
    space-between; 
    width:100%; 
    font-size:22px; 
    font-weight:bold; 
    background:#111; 
    padding:18px 30px; 
    border-radius:10px; 
    border:1px solid #444; 
    position:relative;
    height:62px;
   }

    .scoreboard { display:grid; grid-template-columns:minmax(300px,1fr) minmax(180px,14vw) minmax(300px,1fr); gap:8px; width:100%; flex:1; margin:8px 0; min-height:0; overflow:hidden; }

    .fighter-section { display:flex; flex-direction:column; width:100%; min-width:0; border-radius:0 !important; overflow:hidden; box-shadow:0 4px 10px rgba(0,0,0,0.5); }
    .chung-section { background:#003366; border:2px solid #0033aa; }
    .hong-section { background:#660000; border:2px solid #aa0000; }

    .fighter-header-box { text-align:center; padding:10px 10px 6px 10px; overflow:hidden; }
    .fighter-name { font-size:clamp(34px,2.8vw,40px); font-weight:700; text-transform:uppercase; margin-bottom:2px; text-shadow:2px 2px 4px rgba(0,0,0,0.8); color:#fff !important; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .fighter-club { font-size:clamp(21px,1.9vw,32px); font-weight:600; color:#bbb; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .fighter-body-row { display:flex; flex-direction:row; flex:1; align-items:stretch; width:100%; min-height:0; }

    .side-score-history { 
  padding:6px; 
  width:85px; 
  flex-shrink:0; 
  display:flex; 
  flex-direction:column; 
  gap:4px; 
  overflow-y:auto; 
  max-height:470px; 
  height:100%; 
  align-items:center; 
  -ms-overflow-style: none; /* IE & Edge */

    .side-history-title { font-size:8px; color:#aaa; text-align:center; text-transform:uppercase; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:4px; margin-bottom:4px; font-weight:bold; width:100%; }
    .history-header-row { display:grid; grid-template-columns:repeat(3,1fr); width:100%; text-align:center; margin-bottom:4px; border-bottom:1px dashed rgba(255,255,255,0.15); padding-bottom:4px; justify-items:center; align-items:center; }

    .judge-box-hdr {
      width:20px; height:20px; border-radius:4px; display:flex; align-items:center; justify-content:center;
      font-weight:900; font-size:10px; border:1px solid rgba(255,255,255,0.3); background:#222; color:#ccc;
    }

    /* warna billiard untuk header (letakkan setelah .judge-box-hdr agar override bekerja) */
    .judge-ball-val-1 {
      background: radial-gradient(circle at 35% 35%, #ffee00 0%, #cc9900 100%) !important;
      color: #000 !important;
      box-shadow: 0 0 6px rgba(255,238,0,0.12);
      border-color: rgba(255,255,255,0.08);
    }
    .judge-ball-val-2 {
      background: radial-gradient(circle at 30% 30%, #55ff77, #00cc33) !important;
      color: #111 !important;
      box-shadow: 0 0 8px rgba(85,255,119,0.12);
      border-color: rgba(255,255,255,0.06);
    }
    .judge-ball-val-3 {
      background: radial-gradient(circle at 35% 35%, #ff3333 0%, #880000 100%) !important;
      color: #fff !important;
      box-shadow: 0 0 10px rgba(255,51,51,0.18);
      border-color: rgba(255,255,255,0.06);
    }
    .judge-ball-val-4 {
      background: radial-gradient(circle at 35% 35%, #9933ff 0%, #330066 100%) !important;
      color: #fff !important;
      box-shadow: 0 0 8px rgba(153,51,255,0.12);
      border-color: rgba(255,255,255,0.06);
    }
    .judge-ball-val-5 {
      background: radial-gradient(circle at 35% 35%, #ff9900 0%, #884400 100%) !important;
      color: #fff !important;
      box-shadow: 0 0 8px rgba(255,153,0,0.12);
      border-color: rgba(255,255,255,0.06);
    }

   .history-grid-container { 
  display:flex; 
  flex-direction:column; 
  width:100%; 
  gap:1px; 
  overflow-y:auto; 
  max-height:380px; 
  -ms-overflow-style: none; /* IE & Edge */
  scrollbar-width: none; /* Firefox */
}

.history-grid-container::-webkit-scrollbar,
.side-score-history::-webkit-scrollbar {
  display: none;
}
    .history-row-item { display:grid; grid-template-columns:repeat(3,1fr); width:100%; gap:2px; align-items:center; justify-items:center; background:rgba(255,255,255,0.03); border-radius:4px; padding:1px 0; }
    .history-judge-column { display:flex; flex-direction:column; align-items:center; width:100%; }
    .billiard-ball { width:15px; height:15px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold; color:#000; border:1px solid rgba(255,255,255,0.2); margin:0 auto; }
    .ball-val-1 { background: radial-gradient(circle at 35% 35%, #ffee00 0%, #cc9900 100%); }
    .ball-val-2 { background: radial-gradient(circle at 30% 30%, #55ff77, #00cc33); color:#111; }
    .ball-val-3 { background: radial-gradient(circle at 35% 35%, #ff3333 0%, #880000 100%); color:#fff; }
    .ball-val-4 { background: radial-gradient(circle at 35% 35%, #9933ff 0%, #330066 100%); color:#fff; }
    .ball-val-5 { background: radial-gradient(circle at 35% 35%, #ff9900 0%, #884400 100%); color:#fff; }
    .ball-number { font-size:10px; font-weight: bold }

    /* remaining styles (timer, winner overlay, etc.) - unchanged from previous file */
    .fighter-card { display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:20px 15px; position:relative; min-height:470px; flex:1; width:100%; }
    .chung { background:#0066ff; box-shadow:0 0 15px rgba(0,102,255,0.8); }
    .hong { background:#ff003c; box-shadow:0 0 15px rgba(255,0,60,0.8); }
    .round-wins-container { position:absolute; top:15px; display:flex; flex-direction:column; gap:6px; }
    .chung .round-wins-container { right:15px; }
    .hong .round-wins-container { left:15px; }

/* REVERSE SCREEN - posisi Win Dot */
.scoreboard.swapped .chung .round-wins-container {
    left: 15px;
    right: auto;
}

.scoreboard.swapped .hong .round-wins-container {
    right: 15px;
    left: auto;
}
  
.win-dot { 
  width: 32px; 
  height: 32px; 
  border-radius: 50%; 
  background: transparent;       /* Menyatu dengan background card */
  border: 2px solid transparent; /* Garis pinggir disembunyikan */
  display: flex; 
  align-items: center; 
  justify-content: center; 
  font-size: 12px; 
  font-weight: bold; 
  color: transparent;            /* Teks/angka disembunyikan saat belum aktif */
  transition: all 0.3s ease;     /* Efek transisi halus saat titik menyala */
}

.mini-scores-container {
  display: none;
  flex-direction: column;
  gap: 4px;
  position: absolute;
  top: 15px;
  font-size: 24px;
  font-weight: 800;
  color: #ffffff;
  z-index: 10;
  white-space: nowrap;
}

/* Border putih & background transparan untuk setiap baris skor/span */
.mini-scores-container span,
.mini-score {
  border: none; /* Border putih semi-transparan */
  background: transparent;      /* Latar belakang tipis agar tulisan jelas */
  padding: 0;
  border-radius: 0;
  color: #ffffff;
  box-shadow: none;
  font-weight: 700;
}

/* Card Biru (Chung) - Rata Kiri */
.chung .mini-scores-container {
  left: 15px;
  right: auto;
  align-items: flex-start;
}

/* Card Merah (Hong) - Rata Kanan */
.hong .mini-scores-container {
  right: 15px;
  left: auto;
  align-items: flex-end;
}

/* =========================================================
   REVERSE SCREEN - MINI SCORE
   ========================================================= */

/* REVERSE
   HONG kiri   -> Mini Score kiri
   CHUNG kanan -> Mini Score kanan
*/
.scoreboard.swapped .chung .mini-scores-container {
    left: auto;
    right: 15px;
    align-items: flex-end;
}

.scoreboard.swapped .hong .mini-scores-container {
    right: auto;
    left: 15px;
    align-items: flex-start;
}

/* Item per baris ronde */
.mini-score-item {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Ukuran & Perataan Label R1, R2, R3 */
.round-label {
  width: 32px;
  font-weight: 800;
  color: #f1c40f; /* Warna kuning emas agar kontras */
  flex-shrink: 0;
}

.chung .round-label {
  text-align: left;
}

.hong .round-label {
  text-align: right;
}

/* Perataan Angka Skor */
.round-value {
  min-width: 45px;
  font-weight: 900;
  font-variant-numeric: tabular-nums; /* Lebar digit angka seragam */
}

.chung .round-value {
  text-align: left;
}

.hong .round-value {
  text-align: right;
}

/* Reverse: HONG sekarang berada di kiri */
.scoreboard.swapped .hong .round-label {
    text-align: left;
}

.scoreboard.swapped .hong .round-value {
    text-align: left;
}

/* Reverse: CHUNG sekarang berada di kanan */
.scoreboard.swapped .chung .round-label {
    text-align: right;
}

.scoreboard.swapped .chung .round-value {
    text-align: right;
}

.win-dot.active { 
  background: #f1c40f; 
  border-color: #fff; 
  color: #000; 
  box-shadow: 0 0 12px #f39c12; 
  transform: scale(1.1); 
}

    .score-display { font-size:clamp(300px,15vw,400px); font-weight:900; line-height:0.95; display:flex; align-items:center; justify-content:center; flex:1; width:100%; margin:15px 0; text-align:center; text-shadow:4px 4px 10px rgba(0,0,0,0.9); color:#fff; }
    .score-display.color-white { color:#fff !important; } 
    .score-display.color-yellow { color:#f1c40f !important; }

    .gamjeom-container {
    display: flex;
    align-items: center;

    gap: 10px;

    padding: 8px 18px;

    border-radius: 8px;

    margin-top: auto;
}

   .gamjeom-label { font-size:20px; color:#aaa; } .gamjeom-score { font-size:36px; font-weight:bold; color:#f1c40f; }

    .center-panel { 
  display: flex; 
  flex-direction: column;

  background: #222;

    .center-match-no { font-size:60px; font-weight:bold; font-family:'Arial Black', Gadget, sans-serif; color:#f39c12; background:rgba(0,0,0,0.3); padding:5px 12px; border-radius:6px; border:1px solid #444; text-transform:uppercase; width:100%; text-align:center; }
    .match-group { margin-bottom:40px; width:100%; text-align:center; } .match-label { font-size:30px; font-weight:bold; font-family:'Arial Black', Gadget, sans-serif; letter-spacing:2px; color:#fff; margin-bottom:4px; }
    .round-title { margin-top: 45px !important; font-size:30px; font-weight:bold; color:#fff; text-transform:uppercase; } .round-number { font-size:80px; font-weight:bold; color:#fff; margin-bottom:5px; }
    .timer-status { font-size:22px; font-weight:900; letter-spacing:3px; color:#888; margin-bottom:6px; text-transform:uppercase; text-align:center; line-height:1; }
    .timer-display { font-size:95px !important; font-family:'Bebas Neue', sans-serif; font-weight:bold; color:#00ff66; background:#000; padding:2px 14px; border-radius:8px; border:2px solid #333; line-height:1; letter-spacing:1px; white-space:nowrap; box-shadow:0 4px 10px rgba(0,0,0,0.5); }

    .timer-display.pause-highlight { background-color:#332b00 !important; border-color:#f1c40f !important; color:#f1c40f !important; }

    .timer-reason-box { position:absolute; left:0; width:100%; padding:6px 12px; background:#f1c40f; color:#000; border-radius:6px; font-size:24px; font-weight:bold; text-align:center; text-transform:uppercase; box-shadow:0 0 10px rgba(241,196,15,0.5); display:none; letter-spacing:1px; z-index:6000; pointer-events:none; box-sizing:border-box; }

    .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); z-index:1000; justify-content:center; align-items:center; }

.ryu-logo{
    position:absolute;
    right:20px;

/* Posisi Normal */
.chung-section { order: 1; }
.center-panel  { order: 2; }
.hong-section  { order: 3; }

/* Posisi Dibalik (Swapped) */
.scoreboard.swapped .chung-section { order: 3; }
.scoreboard.swapped .hong-section  { order: 1; }

/* Menjaga History tetap berada di posisi paling luar layar */
.scoreboard.swapped .chung-section .fighter-body-row,
.scoreboard.swapped .hong-section .fighter-body-row {
  flex-direction: row-reverse;
}

/* =========================================================
   LAYOUT BARU
   HEADER NAMA MENYATU DI TENGAH
   CENTER PANEL DIMULAI DI BAWAH HEADER
   ========================================================= */

/* Scoreboard menjadi area relatif untuk center panel */
.scoreboard {
    position: relative;
    display: grid;

    /*
       Hanya 2 kolom:
       kiri = CHUNG
       kanan = HONG

       Center panel akan diletakkan sebagai overlay
       di tengah bagian bawah.
    */
    grid-template-columns: 1fr 1fr;

    gap: 8px;
    width: 100%;
    flex: 1;
    margin: 8px 0;
    min-height: 0;
    overflow: hidden;
}


/* =========================================================
   FIGHTER SECTION
   ========================================================= */

.fighter-section {
    position: relative;
    width: 100%;
    min-width: 0;
    height: 100%;

    border-radius: 15px;
    overflow: hidden;

    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}


/* =========================================================
   HEADER NAMA + KLUB
   ========================================================= */

/*
   Header dibuat lebih tinggi sehingga background
   biru dan merah bertemu tepat di tengah.
*/

/* =========================================================
   GRID NAMA + CLUB
   ========================================================= */

.fighter-header-box {
    min-height: 80px !important;
    height: 80px !important;

    padding: 3px 10px 2px 10px !important;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    box-sizing: border-box;

    border-radius: 0 !important;
}


/* =========================================================
   NAMA
   ========================================================= */

.fighter-name {
    width: 100%;
    text-align: center;

    font-size: clamp(34px, 2.8vw, 40px);
    font-weight: 700;

    text-transform: uppercase;

    margin: 0 !important;

    line-height: 0.95 !important;

    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);

    color: #fff !important;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


/* =========================================================
   CLUB
   ========================================================= */

.fighter-club {
    width: 100%;
    text-align: center;

    font-size: clamp(21px, 1.9vw, 32px);
    font-weight: 600;

    color: #bbb;

    text-transform: uppercase;

    margin: 0 !important;

    line-height: 0.95 !important;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* =========================================================
   BODY FIGHTER
   ========================================================= */

.fighter-body-row {
    position: relative;

    display: flex;
    flex-direction: row;

    width: 100%;

    height: calc(100% - 110px) !important;

    min-height: 0;

    align-items: stretch;
}

/* =========================================================
   CENTER PANEL
   ========================================================= */

/*
   CENTER PANEL TIDAK lagi menjadi kolom grid penuh.

   Dia menjadi panel overlay yang dimulai
   setelah header nama/klub.
*/

.center-panel {
    position: absolute;
    z-index: 50;

    top: 145px;
    bottom: 0;

    /* PANEL TENGAH DIPERSEMPIT */
    left: 41%;
    width: 18%;

    margin: 0;

    background: #222;

    border-radius: 0;
    border: 1px solid #444;

    display: flex;
    flex-direction: column;

    justify-content: flex-start;
    align-items: center;

    padding: 20px;

    gap: 8px;

    overflow: hidden;
}
/* =========================================================
   MATCH
   ========================================================= */

.center-panel {
    position: absolute;
    z-index: 50;

    top: 145px;
    bottom: 0;

    /* Lebar panel mengikuti ukuran MATCH */
    left: 50%;
    width: 220px;

    transform: translateX(-50%);

    margin: 0;

    background: #222;

    border-radius: 0;
    border: 1px solid #444;

    display: flex;
    flex-direction: column;

    justify-content: flex-start;
    align-items: center;

    padding: 20px;

    gap: 8px;

    overflow: hidden;
}

/* =========================================================
   MATCH GROUP
   ========================================================= */

.match-group {
    width: 100%;

    text-align: center;

    margin-bottom: 20px;
}


/* =========================================================
   TIMER
   ========================================================= */

.timer-status {
    width: 100%;

    text-align: center;

    font-size: 22px;

    font-weight: 900;

    letter-spacing: 3px;

    color: #888;

    margin-bottom: 6px;

    text-transform: uppercase;

    line-height: 1;
}


/* =========================================================
   TIMER BOX - MENGIKUTI UKURAN FONT TIMER
   ========================================================= */

.timer-display {
    width: fit-content !important;
    min-width: fit-content !important;
    max-width: none !important;

    display: inline-flex !important;

    align-self: center !important;

    flex: 0 0 auto !important;

    margin-left: auto !important;
    margin-right: auto !important;

    box-sizing: border-box !important;

    justify-content: center !important;
    align-items: center !important;

    white-space: nowrap !important;

    transform: translateX(-20px) !important;
}

/* =========================================================
   ROUND
   ========================================================= */

.round-title {
    margin-top: 45px !important;
    width: 100%;

    text-align: center;

    font-size: 30px;

    font-weight: bold;

    color: #fff;

    text-transform: uppercase;
}


.round-number {
    width: 100%;

    text-align: center;

    font-size: 80px;

    font-weight: bold;

    color: #fff;

    margin-bottom: 5px;
}


/* =========================================================
   NORMAL ORDER
   ========================================================= */

.chung-section {
    grid-column: 1;
}

.hong-section {
    grid-column: 2;
}


/* =========================================================
   REVERSE ORDER
   ========================================================= */

/*
   Saat Reverse:
   CHUNG -> kanan
   HONG  -> kiri
*/

.scoreboard.swapped .chung-section {
    grid-column: 2;
}

.scoreboard.swapped .hong-section {
    grid-column: 1;
}


/* =========================================================
   HISTORY TETAP DI SISI LUAR
   ========================================================= */

.scoreboard.swapped .chung-section .fighter-body-row,
.scoreboard.swapped .hong-section .fighter-body-row {
    flex-direction: row-reverse;
}


/* =========================================================
   WIN DOT
   ========================================================= */

/* Normal */
.chung .round-wins-container {
    right: 15px;
    left: auto;
}

.hong .round-wins-container {
    left: 15px;
    right: auto;
}


/* Reverse */
.scoreboard.swapped .chung .round-wins-container {
    left: 15px;
    right: auto;
}

.scoreboard.swapped .hong .round-wins-container {
    right: 15px;
    left: auto;
}


/* =========================================================
   MINI SCORE
   ========================================================= */

/* Normal */
.chung .mini-scores-container {
    left: 15px;
    right: auto;

  <script>
    // Extend receiver script - final version
    const DBG = true;

    // Simple selectors
    const $ = id => document.getElementById(id);
    const setText = (id, txt) => { const el = $(id); if (el) el.innerText = (txt === undefined || txt === null) ? '' : String(txt); };

    // Normalize various payload shapes into canonical fields
    function normalizePayload(src = {}) {
      const out = {};
      out.scores = src.scores || (src.score ? { chung: src.score.chung, hong: src.score.hong } : null)
        || (src.scoresData || null)
        || (src.redScore !== undefined || src.blueScore !== undefined ? { chung: src.redScore, hong: src.blueScore } : null)
        || (src.red !== undefined || src.blue !== undefined ? { chung: src.red, hong: src.blue } : {});
      
      out.superioritySide = src.superioritySide || src.superior || src.sup || src.highlightWinner || src.winnerSide || src.criteriaWinner || null;
      out.matchDetail = src.matchDetail || src.details || src.matchDetails || null;     

      out.gamjeom = src.gamjeom || src.penalties || src.gam || (src.pen ? { chung: src.pen.chung, hong: src.pen.hong } : null) || {};
      out.activeMatch = src.activeMatch || src.match || src.matchInfo || {
        matchNo: src.matchNo || src.match_number || src.match_id || src.matchId,
        category: src.category || src.categoryName || src.cat,
        chungName: src.chungName || src.redName || src.red_name,
        chungClub: src.chungClub || src.redClub,
        hongName: src.hongName || src.blueName || src.blue_name,
        hongClub: src.hongClub || src.blueClub
      };
      out.currentRound = src.currentRound ?? src.round ?? src.roundNumber ?? src.roundDisplay;
      out.timeRemaining = src.timeRemaining ?? src.timer ?? src.timeLeft ?? src.remainSeconds;
      out.isRestMode = !!(src.isRestMode || src.rest);
      out.isKeshiMode = !!(src.isKeshiMode || src.keshi || src.kyeShi);
      out.isRunning = !!(src.isRunning || src.running);
      out.matchEnded = !!(src.matchEnded || src.ended || src.isEnded);
      out.roundWins = src.roundWins || src.roundsWon || src.round_win || src.rounds || {};
      out.history = {};
      out.history.chung = src.history?.chung || src.historyChung || src.gridHistoryChung || src.chungHistory || src.historyRed || src.history?.red || src.redHistory || src.pointHistory?.red || null;
      out.history.hong = src.history?.hong || src.historyHong || src.gridHistoryHong || src.hongHistory || src.historyBlue || src.history?.blue || src.blueHistory || src.pointHistory?.blue || null;
      out.judgeGlows =
    src.judgeGlows ||
    src.judgeIndicators ||
    src.judgeLights ||
    src.judges ||
    src.lights ||
    src.indicators ||
    null;

out.judges = out.judgeGlows;
      out.showWooseGirok = src.showWooseGirok !== undefined ? !!src.showWooseGirok : (src.wooseGirok || src.woose || src.modal?.woose || src.modals?.woose || false);
      out.matchWinner = src.matchWinner || src.winner || src.winOverlay || src.win || null;
      out.globalMessage = src.globalMessage || src.message || src.statusMessage || src.msg || '';
      out.highlightWinner = src.highlightWinner || src.winnerSide || src.highlight || src.superiority || src.sup || src.superioritySide || src.criteriaWinner || null;
      out.roundScoresHistory = src.roundScoresHistory || src.roundScores || null;
      out._originalKeys = Object.keys(src);
      return out;
    }

    // Renderers for scores, gamjeom, match info, timer
    // Render skor dengan dukungan highlight warna kuning saat skor seri & unggul teknik
function renderScores(
    scores,
    superioritySide = null,
    matchDetail = null,
    isRestMode = false,
    roundWins = null,
    matchEnded = false,
    gamjeom = null
) {
    if (!scores) return;

    const chungElem = $('chung-score');
    const hongElem = $('hong-score');

    if (!chungElem || !hongElem) return;


    // =====================================================
    // HITUNG JUMLAH ROUND MENANG
    // =====================================================

    const countWins = (side) => {
        if (!side) return 0;

        if (typeof side === 'number') {
            return side;
        }

        if (Array.isArray(side)) {
            return side.filter(Boolean).length;
        }

        if (typeof side === 'object') {
            return Object.values(side).filter(Boolean).length;
        }

        return 0;
    };


    // =====================================================
    // SKOR YANG DITAMPILKAN
    // =====================================================

    let displayChung;
    let displayHong;

    if ((isRestMode || matchEnded) && roundWins) {

        displayChung = countWins(roundWins.chung);
        displayHong = countWins(roundWins.hong);

    } else {

        displayChung =
            Number(
                scores.chung ??
                scores.blue ??
                scores.red ??
                scores.chungScore ??
                0
            );

        displayHong =
            Number(
                scores.hong ??
                scores.red ??
                scores.blue ??
                scores.hongScore ??
                0
            );
    }


    setText('chung-score', displayChung);
    setText('hong-score', displayHong);


    // =====================================================
    // RESET WARNA
    // =====================================================

    chungElem.className = "score-display";
    hongElem.className = "score-display";


    // =====================================================
    // REST TIME
    // =====================================================

    if (isRestMode) {

        chungElem.classList.add("color-white");
        hongElem.classList.add("color-white");

        return;
    }


    // =====================================================
    // 1. TOTAL SKOR BERBEDA
    //
    // GAM-JEOM TETAP MASUK TOTAL SKOR
    //
    // Contoh:
    // Biru 5 - Merah 3
    // → Biru KUNING
    // =====================================================

    if (displayChung > displayHong) {

        chungElem.classList.add("color-yellow");
        hongElem.classList.add("color-white");

        return;
    }

    if (displayHong > displayChung) {

        chungElem.classList.add("color-white");
        hongElem.classList.add("color-yellow");

        return;
    }


    // =====================================================
    // 2. TOTAL SKOR SERI
    //
    // SEKARANG BARU CEK KEUNGGULAN TEKNIK
    //
    // GAM-JEOM TIDAK DIHITUNG SEBAGAI TEKNIK
    // =====================================================


    // -----------------------------------------------------
    // Ambil data teknik
    // -----------------------------------------------------

    const c = matchDetail?.chung || {};
    const h = matchDetail?.hong || {};


    // =====================================================
    // URUTAN KRITERIA WT
    // =====================================================

    const criteria = [
        'turnHead',
        'turnBody',
        'head',
        'body',
        'punch'
    ];


    // =====================================================
    // BANDINKAN SATU PER SATU
    //
    // Jika Turning Head sama → lanjut Turning Body
    // Jika Turning Body sama → lanjut Head
    // dst.
    // =====================================================

    for (const key of criteria) {

        const cValue = Number(c[key] ?? 0);
        const hValue = Number(h[key] ?? 0);


        // -------------------------------------------------
        // BIRU UNGGUL TEKNIK
        // -------------------------------------------------

        if (cValue > hValue) {

            chungElem.classList.add("color-yellow");
            hongElem.classList.add("color-white");

            return;
        }


        // -------------------------------------------------
        // MERAH UNGGUL TEKNIK
        // -------------------------------------------------

        if (hValue > cValue) {

            chungElem.classList.add("color-white");
            hongElem.classList.add("color-yellow");

            return;
        }

        // Jika sama → lanjut kriteria berikutnya
    }


    // =====================================================
    // 3. JIKA TEKNIK JUGA SAMA
    //
    // BARU GUNAKAN SUPERIORITY
    // =====================================================

    const superior = String(superioritySide || "").toLowerCase();


    if (
        superior === "chung" ||
        superior === "blue" ||
        superior === "c"
    ) {

        chungElem.classList.add("color-yellow");
        hongElem.classList.add("color-white");

        return;
    }


    if (
        superior === "hong" ||
        superior === "red" ||
        superior === "h"
    ) {

        chungElem.classList.add("color-white");
        hongElem.classList.add("color-yellow");

        return;
    }


    // =====================================================
    // 4. BENAR-BENAR SAMA
    // =====================================================

    chungElem.classList.add("color-white");
    hongElem.classList.add("color-white");
}

    function renderGamjeom(gam) {
      if (!gam) return;
      const c = gam.chung ?? gam.red ?? gam.chungGam ?? 0;
      const h = gam.hong ?? gam.blue ?? gam.hongGam ?? 0;
      if ($('chung-gamjeom')) setText('chung-gamjeom', c ?? 0);
      if ($('hong-gamjeom')) setText('hong-gamjeom', h ?? 0);
    }
    function renderMatchInfo(active) {
      if (!active) return;
      setText('match-no', active.matchNo ?? active.match_number ?? '');
      setText('category', active.category ?? '');
      setText('chung-name', active.chungName ?? active.chung ?? 'CHUNG');
      setText('chung-club', active.chungClub ?? active.chungClub ?? '');
      setText('hong-name', active.hongName ?? active.hong ?? 'HONG');
      setText('hong-club', active.hongClub ?? active.hongClub ?? '');
    }
    
function renderTimer(normalized) {

    if ($('round-display'))
        setText('round-display', normalized.currentRound ?? 1);

    let timerText;

    if (
        normalized.isRunning &&
        !normalized.isRestMode &&
        !normalized.isKeshiMode &&
        normalized.timeRemaining <= 10 &&
        normalized.timeRemaining > 0
    ) {

        // 9.99 → 0.01
        timerText = normalized.timeRemaining.toFixed(2);

    } else {

        const min = Math.floor(normalized.timeRemaining / 60);
        const sec = Math.floor(normalized.timeRemaining % 60);

        timerText = `${min}:${String(sec).padStart(2,'0')}`;

    }

setText('timer-display', timerText);
const timerDisplay = $('timer-display'), timerStatus = $('timer-status');
      if (timerDisplay) timerDisplay.classList.remove('rest-mode','keshi-mode','pause-highlight');
      if (!timerStatus) return;
      if (normalized.isRestMode) { timerStatus.innerText = 'REST TIME'; timerStatus.style.color = '#e6b400'; if (timerDisplay) timerDisplay.classList.add('rest-mode'); }
      else if (normalized.isKeshiMode) { timerStatus.innerText = 'KYE-SHI'; timerStatus.style.color = '#ff1744'; if (timerDisplay) timerDisplay.classList.add('keshi-mode'); }
      else if (normalized.matchEnded) { timerStatus.innerText = 'MATCH ENDED'; timerStatus.style.color = '#888'; }
      else if (normalized.isRunning) { timerStatus.innerText = 'RUNNING'; timerStatus.style.color = '#00e676'; }
      else { timerStatus.innerText = ''; timerStatus.style.color = '#e6b400'; if (timerDisplay) timerDisplay.classList.add('pause-highlight'); }
    }

    // showTimerReason - absolute box below timer-display
    function showTimerReason(reason, options = {}) {
      try {
        const center = document.querySelector('.center-panel');
        if (!center) return;
        let reasonBox = document.getElementById('timerReasonBox');
        if (!reasonBox) { reasonBox = document.createElement('div'); reasonBox.id = 'timerReasonBox'; reasonBox.className = 'timer-reason-box'; center.appendChild(reasonBox); }
        if (!reason) { reasonBox.style.display = 'none'; return; }
        let txt = String(reason).toUpperCase();
        if (txt === 'PAUSE' || txt === 'TIMEOUT' || txt === 'TIME OUT') txt = 'TIME OUT';

      rows = rows.filter(row => {
        if (!row) return false;

        // Cek flag Gam-jeom yang bernilai TRUE/EKSPLISIT

                      row.type === 'gamjeom' ||

                      (typeof row.action === 'string' && row.action.toLowerCase().includes('gamjeom'));

        return !isGam;
      });

      function extractNumericFromVal(val) {
        if (val === null || val === undefined || val === '') return null;
        if (typeof val === 'number') return val;

        if (typeof val === 'object') {
          if (val.isGamjeom || val.gamjeom || val.type === 'gamjeom') return null;
          const maybe = val.delta ?? val.points ?? val.value ?? val.point ?? val.p ?? val.v ?? val.score ?? null;
          if (maybe !== null && maybe !== undefined) { if (typeof maybe === 'number') return maybe; if (typeof maybe === 'string') { const m = String(maybe).match(/-?\d+/); return m ? parseInt(m[0],10) : null; } }

            for (const k of keys) if (r && Object.prototype.hasOwnProperty.call(r,k)) return r[k];
            const upper = `J${i}`; if (r && r[upper] !== undefined) return r[upper];
            if (r[0] !== undefined || r[1] !== undefined || r[2] !== undefined) return r[i-1];
            return null;

            inner.textContent = 'G';
            judgeCol.appendChild(inner);
          } 
          else {
            const numeric = extractNumericFromVal(val);
            const sVal = String(val !== null && val !== undefined ? val : '').trim();

            // Cek apakah ini benar-benar poin teknis (T.Poin) dari operator
            const isTechnicalPoint = (val && (val.isTechnical || val.type === 'technical' || val.isTPoin || val.source === 'operator' || val.isTechnicalPoint));
            const targetVal = numeric !== null ? numeric : (parseInt(sVal, 10) || 0);

            if ((sVal === '4' || sVal === '5' || numeric === 4 || numeric === 5) && isTechnicalPoint) {
              // Jika ini murni T.Poin dari operator, jadikan KOTAK

    // applyJudgeArrayToHeader: per-element timer + caching so equal repeated values don't restart the timer
    (function(){
      const DEFAULT_INDICATOR_MS = 1000;

      function clearJudgeAt(el) {
        if (!el) return;
        el.classList.remove('judge-ball-val-1','judge-ball-val-2','judge-ball-val-3','judge-ball-val-4','judge-ball-val-5');
        el.style.background = ''; el.style.color = ''; el.style.boxShadow = '';
        if (el.dataset.origLabel) el.textContent = el.dataset.origLabel;
        delete el.dataset.currentVal;
      }

      window.applyJudgeArrayToHeader = function(headerEls, arr = [], timeoutMs = DEFAULT_INDICATOR_MS) {
        try {
          const els = Array.from(headerEls || []);
          els.forEach((el, idx) => {
            if (!el) return;
            if (!el.dataset.origLabel) el.dataset.origLabel = el.textContent?.trim() || String(idx + 1);

            const val = arr[idx];

            // create canonical key
            let key;
            if (val === undefined || val === null) key = '__null__';
            else if (val === true || val === false) key = String(!!val);
            else if (!isNaN(parseInt(val,10))) key = 'n:' + String(parseInt(val,10));
            else key = 's:' + String(val);

            // if value unchanged, do not restart timer
            if (el.dataset.currentVal === key) return;

            if (el._judgeTimer) { clearTimeout(el._judgeTimer); el._judgeTimer = null; }

            clearJudgeAt(el);
            el.dataset.currentVal = key;

            if (val === undefined || val === null) return;

            if (val === true || val === 'on' || val === '1') {
              el.classList.add('judge-ball-val-2'); el.textContent = '';
              el._judgeTimer = setTimeout(() => { clearJudgeAt(el); el._judgeTimer = null; }, timeoutMs);
              return;
            }
            if (val === false || val === 0 || val === '0') { clearJudgeAt(el); return; }

            const n = parseInt(val, 10);
            if (!isNaN(n)) {
              const v = Math.min(5, Math.max(1, Math.abs(n)));
              el.classList.add(`judge-ball-val-${v}`); el.textContent = String(n);
              el._judgeTimer = setTimeout(() => { clearJudgeAt(el); el._judgeTimer = null; }, timeoutMs);
              return;
            }

            const s = String(val).toLowerCase();
            if (s.includes('chung') || s.includes('blue')) {
              el.classList.add('judge-ball-val-2'); el.textContent = '';
              el._judgeTimer = setTimeout(() => { clearJudgeAt(el); el._judgeTimer = null; }, timeoutMs);
              return;
            }
            if (s.includes('hong') || s.includes('red')) {
              el.classList.add('judge-ball-val-3'); el.textContent = '';
              el._judgeTimer = setTimeout(() => { clearJudgeAt(el); el._judgeTimer = null; }, timeoutMs);
              return;
            }

            const m = String(val).match(/-?\d+/);
            if (m) {
              const v = Math.min(5, Math.max(1, Math.abs(parseInt(m[0],10))));
              el.classList.add(`judge-ball-val-${v}`); el.textContent = m[0];
              el._judgeTimer = setTimeout(() => { clearJudgeAt(el); el._judgeTimer = null; }, timeoutMs);
              return;
            }
          });
        } catch (err) { console.warn('applyJudgeArrayToHeader err', err); }
      };
    })();

function getLatestRowCells(rows) {
      if (!rows) return [null, null, null];
      let arr = rows;
      if (typeof arr === 'object' && !Array.isArray(arr) && arr.rows) arr = arr.rows;
      if (!Array.isArray(arr) && typeof arr === 'object') {
        const keys = Object.keys(arr).sort((a,b) => Number(a) - Number(b));
        if (keys.length > 0) arr = keys.map(k => arr[k]);
      }
      if (!Array.isArray(arr) || arr.length === 0) return [null, null, null];
      const lastRow = arr[arr.length - 1];
      if (Array.isArray(lastRow)) {
        return [lastRow[0] ?? null, lastRow[1] ?? null, lastRow[2] ?? null];
      } else if (typeof lastRow === 'object' && lastRow !== null) {
        const getCell = (r, i) => {
          const keys = [`j${i}`, `J${i}`, `judge${i}`, `judge_${i}`, `${i}`, i===1?'first':i===2?'second':'third'];
          for (const k of keys) if (r[k] !== undefined) return r[k];
          if (r[0] !== undefined || r[1] !== undefined || r[2] !== undefined) return r[i-1];
          return null;
        };
        return [getCell(lastRow, 1), getCell(lastRow, 2), getCell(lastRow, 3)];
      }
      return [null, lastRow, null];
    }

     // ============================================================
    // OPTIMASI 1: BATCHING SYSTEM (RAF) - Kumpulkan update dalam 1 frame
    // ============================================================
    const UpdateBatcher = {
      queue: [],
      rafId: null,
      
      add(callback) {
        this.queue.push(callback);
        if (!this.rafId) {
          this.rafId = requestAnimationFrame(() => this.flush());
        }
      },
      
      flush() {
        this.queue.forEach(cb => cb());
        this.queue = [];
        this.rafId = null;
      }
    };

    // ============================================================
    // OPTIMASI 2: CACHING - Skip update jika value sama
    // ============================================================
    const ValueCache = {
      data: {},
      
      hasChanged(key, value) {
        if (this.data[key] !== value) {
          this.data[key] = value;
          return true;
        }
        return false;
      },
      
      clear() {
        this.data = {};
      }
    };

    // ============================================================
    // OPTIMASI 3: HISTORY LIMITER - Batasi max 12 items
    // ============================================================
    const HistoryManager = {
      MAX_ITEMS: 12,
      
      addRow(containerId, judgeScores) {
        const container = document.getElementById(containerId);
        const row = document.createElement('div');
        row.className = 'history-row-item';
        
        judgeScores.forEach(score => {
          const col = document.createElement('div');
          col.className = 'history-judge-column';
          const ball = document.createElement('div');
          ball.className = `billiard-ball ball-val-${score}`;
          ball.innerHTML = `<div class="ball-number">${score}</div>`;
          col.appendChild(ball);
          row.appendChild(col);
        });
        
        container.appendChild(row);
        container.scrollTop = container.scrollHeight;
        
        // Hapus item lama jika melebihi limit
        const items = container.querySelectorAll('.history-row-item');
        if (items.length > this.MAX_ITEMS) {
          items[0].remove();
        }
      }
    };

    // ============================================================
    // OPTIMASI 4: GPU ACCELERATION - Aplikasikan di CSS elements
    // ============================================================
    function enableGPUAcceleration() {
      const elements = [
        'history-grid-container',
        'chungHistory',
        'hongHistory',
        'side-score-history'
      ];
      
      elements.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.style.willChange = 'transform';
          el.style.transform = 'translate3d(0,0,0)';
        }
      });
    }

    // ============================================================
    // API FUNCTIONS - Gunakan optimization layer
    // ============================================================
    
    window.updateExtendScore = function(chung, hong) {
      if (!ValueCache.hasChanged('chungScore', chung) && 
          !ValueCache.hasChanged('hongScore', hong)) return;
      
      UpdateBatcher.add(() => {
        document.getElementById('chungScore').textContent = chung;
        document.getElementById('hongScore').textContent = hong;
      });
    };

    window.updateExtendGamjeom = function(chung, hong) {
      if (!ValueCache.hasChanged('chungGamjeom', chung) && 
          !ValueCache.hasChanged('hongGamjeom', hong)) return;
      
      UpdateBatcher.add(() => {
        document.getElementById('chungGamjeom').textContent = chung;
        document.getElementById('hongGamjeom').textContent = hong;
      });
    };

    window.updateExtendTimer = function(timeStr, status) {
      if (!ValueCache.hasChanged('timerText', timeStr) && 
          !ValueCache.hasChanged('timerStatus', status)) return;
      
      UpdateBatcher.add(() => {
        const display = document.getElementById('timerDisplay');
        display.textContent = timeStr;
        display.className = 'timer-display';
        if (status === 'rest') display.classList.add('rest-mode');
        if (status === 'keshi') display.classList.add('keshi-mode');
      });
    };

    window.updateExtendRound = function(roundNum) {
      if (!ValueCache.hasChanged('round', roundNum)) return;
      
      UpdateBatcher.add(() => {
        document.getElementById('roundNumber').textContent = roundNum;
      });
    };

    window.updateExtendMatch = function(matchNo) {
      if (!ValueCache.hasChanged('match', matchNo)) return;
      
      UpdateBatcher.add(() => {
        document.getElementById('centerMatchNo').textContent = matchNo;
        document.getElementById('matchNo').textContent = matchNo;
      });
    };

    window.addExtendHistory = function(judgesChung, judgesHong) {
      UpdateBatcher.add(() => {
        HistoryManager.addRow('chungHistory', judgesChung);
        HistoryManager.addRow('hongHistory', judgesHong);
      });
    };

    window.updateExtendWinDots = function(chungWins, hongWins) {
      UpdateBatcher.add(() => {
        // Chung
        const chungContainer = document.getElementById('chungWins');
        chungContainer.innerHTML = '';
        for (let i = 0; i < 3; i++) {
          const dot = document.createElement('div');
          dot.className = 'win-dot';
          if (i < chungWins) dot.classList.add('active');
          dot.textContent = i + 1;
          chungContainer.appendChild(dot);
        }
        
        // Hong
        const hongContainer = document.getElementById('hongWins');
        hongContainer.innerHTML = '';
        for (let i = 0; i < 3; i++) {
          const dot = document.createElement('div');
          dot.className = 'win-dot';
          if (i < hongWins) dot.classList.add('active');
          dot.textContent = i + 1;
          hongContainer.appendChild(dot);
        }
      });
    };

    window.updateExtendFighterInfo = function(chungName, chungClub, hongName, hongClub) {
      UpdateBatcher.add(() => {
        document.getElementById('chungFighterName').textContent = chungName.toUpperCase();
        document.getElementById('chungClub').textContent = chungClub.toUpperCase();
        document.getElementById('hongFighterName').textContent = hongName.toUpperCase();
        document.getElementById('hongClub').textContent = hongClub.toUpperCase();
        document.getElementById('chungName').textContent = chungName.toUpperCase();
        document.getElementById('hongName').textContent = hongName.toUpperCase();
      });
    };

    window.swapExtendDisplay = function(isSwapped) {
      UpdateBatcher.add(() => {
        const scoreboard = document.getElementById('scoreboard');
        if (isSwapped) {
          scoreboard.classList.add('swapped');
        } else {
          scoreboard.classList.remove('swapped');
        }
      });
    };

    // Jalankan GPU acceleration saat load
    window.addEventListener('load', enableGPUAcceleration);

    console.log('✓ Extend Display Loaded - Optimization Ready');

  </script>
</body>
</html>
